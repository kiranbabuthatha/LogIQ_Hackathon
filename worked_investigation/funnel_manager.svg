<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="Segoe UI, Arial"><rect width="760" height="420" fill="white"/><text x="20" y="30" font-size="17" font-weight="bold">Manager: what survived the filter</text><polygon points="100.0,60 660.0,60 617.0,122 143.0,122" fill="#70ad47" fill-opacity="0.88" stroke="#204"/><text x="380.0" y="89.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">207,820 lines</text><text x="380.0" y="107.0" text-anchor="middle" font-size="11.5" fill="#123">whole OpenStack corpus</text><polygon points="143.0,130 617.0,130 574.0,192 186.0,192" fill="#4472c4" fill-opacity="0.88" stroke="#204"/><text x="380.0" y="159.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3,039 problem lines</text><text x="380.0" y="177.0" text-anchor="middle" font-size="11.5" fill="#123">in the investigated window</text><polygon points="186.0,200 574.0,200 531.0,262 229.0,262" fill="#c00000" fill-opacity="0.88" stroke="#204"/><text x="380.0" y="229.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2 identity-token CRITICAL lines</text><text x="380.0" y="247.0" text-anchor="middle" font-size="11.5" fill="#123">separate, highest-severity risk (E72) — needs an owner</text><polygon points="229.0,270 531.0,270 488.0,332 272.0,332" fill="#ed7d31" fill-opacity="0.88" stroke="#204"/><text x="380.0" y="299.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">8-line ERROR patterns</text><text x="380.0" y="317.0" text-anchor="middle" font-size="11.5" fill="#123">the disk-processing bundle (E50/E61/E63/E58...) — rising label</text><polygon points="272.0,340 488.0,340 445.0,402 315.0,402" fill="#bf9000" fill-opacity="0.88" stroke="#204"/><text x="380.0" y="369.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Action: assign the unassigned owner</text><text x="380.0" y="387.0" text-anchor="middle" font-size="11.5" fill="#123">and verify disk-path availability — the one next step</text></svg>