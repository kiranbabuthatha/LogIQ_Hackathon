<svg xmlns="http://www.w3.org/2000/svg" width="700" height="445" font-family="Segoe UI, Arial"><rect width="700" height="445" fill="white"/><text x="20" y="30" font-size="17" font-weight="bold">Engineer: how the search results nest</text><circle cx="330" cy="200" r="150" fill="#5b9bd5" fill-opacity="0.30" stroke="#345"/><circle cx="380" cy="185" r="105" fill="#ed7d31" fill-opacity="0.35" stroke="#542"/><circle cx="415" cy="175" r="62" fill="#c00000" fill-opacity="0.35" stroke="#702"/><text x="150" y="380" font-size="13">192 ERROR lines in oslo_service.periodic_task</text><text x="330" y="315" font-size="13">24 qemu-img matches (exception + command + stderr)</text><text x="385" y="130" font-size="13">8 InvalidDiskInfo exceptions</text><text x="405" y="160" font-size="12" fill="#700">1 representative line 45631</text><text x="20" y="420" font-size="12" fill="#555">The 8 exceptions are a subset of the 24 qemu-img lines (each exception ships with its command + stderr lines); all 24 sit inside the recurring traceback bundle.</text></svg>